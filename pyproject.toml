[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aadd-attack-pipeline"
version = "0.1.0"
description = "Reproducible adversarial-attack research pipeline and OpenCode control plane"
requires-python = "==3.12.3"

# find_namespace, because ops/ is a PEP 420 namespace package and a plain
# find would ship attacklab without ops.gpuq.
[tool.setuptools.packages.find]
namespaces = true
include = ["attacklab*", "ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
