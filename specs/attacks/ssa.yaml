schema_version: 1
idea_id: ssa
status: approved
title: Spectrum Simulation Attack with S-squared I-FGSM
hypothesis: 'Усреднение градиентов по случайным преобразованиям спектра уменьшит зависимость
  от частотных особенностей source detector и повысит transfer ASR.

  '
novelty: 'На каждой итерации несколько DCT-представлений случайно зашумляются и масштабируются,
  после чего их пространственные градиенты усредняются.

  '
baseline:
  attack: mi-di-fgsm
implementation:
  module: attacks.ssa_s2i_fgsm
  source_model: each-valid-single-source
  targeted: true
parameters:
  epsilon:
  - 0.00784313725490196
  - 0.01568627450980392
  - 0.03137254901960784
  step_size: epsilon / iterations
  iterations: 10
  momentum: 1.0
  frequency_samples: 20
  spectrum_noise_sigma: 0.06274509803921569
  spectrum_amplitude_rho: 0.5
  transform: orthonormal-dct
evaluation:
  first_scope: full
  source_label: 1
  target_class: 0
  secondary_condition: untargeted-both-classes
  manifest: manifests/celebA/test_fake.jsonl
  sample_limit: null
  source_target_protocol: all-valid-single-source-pairs
  target_models:
  - vit_b_16
  - densenet121_dct
  seed: 0
required_tests:
- output shape and uint8 type
- finite gradients through DCT and inverse DCT
- deterministic output for fixed seed
- targeted loss direction
- Linf projection after every update
- frequency sample count is honored
- identity spectrum transform recovers momentum iterative baseline
- zero spectrum noise and zero amplitude range recover the identity transform
retention_gate:
  metric: conditional_transfer_asr
  minimum_gain_percentage_points: 0
  maximum_ssim_regression: 0.01
  maximum_lpips_regression: 0.01
gpu:
  requested_memory_mb: 24000
  timeout_seconds: 21600
protected_files:
- AADD-2026/AADD_2026_evaluation.py
- manifests
- weights
- results
