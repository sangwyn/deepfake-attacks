schema_version: 1
idea_id: fgsm
status: approved
title: Fast Gradient Sign Method
hypothesis: 'Один целевой шаг по знаку градиента покажет минимальный уровень white-box-уязвимости
  каждого детектора при фиксированном Linf-бюджете.

  '
novelty: 'Это контрольный классический baseline без итераций, momentum, преобразований входа,
  ансамблирования или оптимизации в latent-space.

  '
baseline:
  attack: clean
implementation:
  module: attacks.fgsm
  source_model: each-valid-single-source
  targeted: true
parameters:
  epsilon:
  - 0.00784313725490196
  - 0.01568627450980392
  - 0.03137254901960784
  iterations: 1
evaluation:
  first_scope: full
  source_label: 1
  target_class: 0
  secondary_condition: untargeted-both-classes
  manifest: manifests/celebA/test_fake.jsonl
  sample_limit: null
  source_target_protocol: all-valid-single-source-pairs
  target_models:
  - vit_b_16
  - densenet121_dct
  seed: 0
required_tests:
- output shape and uint8 type
- finite nonzero gradients
- deterministic output for fixed seed
- targeted loss direction
- Linf bound after uint8 save and reload
- epsilon-zero identity recovery
- selected source adapter is used
retention_gate:
  metric: white_box_conditional_asr
  minimum_gain_percentage_points: 0
  maximum_ssim_regression: 0.01
  maximum_lpips_regression: 0.01
gpu:
  requested_memory_mb: 24000
  timeout_seconds: 7200
protected_files:
- AADD-2026/AADD_2026_evaluation.py
- manifests
- weights
- results
