schema_version: 1
idea_id: mi-di-fgsm
status: approved
title: Momentum Diverse-Input Iterative FGSM
hypothesis: 'Накопление momentum и случайные resize-padding преобразования уменьшат переобучение
  на source detector и повысят transfer ASR относительно PGD.

  '
novelty: 'Градиент нормализуется и накапливается между итерациями, а на каждой итерации вычисляется
  через стохастически преобразованный вход.

  '
baseline:
  attack: pgd
implementation:
  module: attacks.mi_di_fgsm
  source_model: each-valid-single-source
  targeted: true
parameters:
  epsilon:
  - 0.00784313725490196
  - 0.01568627450980392
  - 0.03137254901960784
  step_size: epsilon / iterations
  iterations: 10
  momentum: 1.0
  input_diversity_probability: 0.5
  resize_min_fraction: 0.9
  resize_max_fraction: 1.0
  padding: random
evaluation:
  first_scope: full
  source_label: 1
  target_class: 0
  secondary_condition: untargeted-both-classes
  manifest: manifests/celebA/test_fake.jsonl
  sample_limit: null
  source_target_protocol: all-valid-single-source-pairs
  target_models:
  - vit_b_16
  - densenet121_dct
  seed: 0
required_tests:
- output shape and uint8 type
- finite gradients through resize and padding
- deterministic output for fixed seed
- targeted loss direction
- Linf projection after every update
- momentum normalization and accumulation
- momentum-only recovery when diversity probability is zero
- diverse-input-only recovery when momentum is zero
- iterative baseline recovery when both additions are disabled
retention_gate:
  metric: conditional_transfer_asr
  minimum_gain_percentage_points: 0
  maximum_ssim_regression: 0.01
  maximum_lpips_regression: 0.01
gpu:
  requested_memory_mb: 24000
  timeout_seconds: 14400
protected_files:
- AADD-2026/AADD_2026_evaluation.py
- manifests
- weights
- results
