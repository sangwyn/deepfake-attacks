schema_version: 1
idea_id: mig-cow
status: approved
title: Momentum Integrated Gradients with Consensus-Orthogonal Weighting
hypothesis: 'Выделение согласованных направлений градиента гетерогенного ансамбля повысит
  ASR на held-out detector относительно равновесного ансамбля.

  '
novelty: 'Integrated gradients каждого source detector разлагаются на согласованную и модельно-специфичную
  ортогональную части до momentum-обновления.

  '
baseline:
  attack: ensemble-mi-fgsm
implementation:
  module: attacks.mig_cow
  source_model: leave-one-detector-out-ensemble
  targeted: true
  fidelity: exact-published-method
  missing_prerequisite_policy: blocked
parameters:
  epsilon:
  - 0.00784313725490196
  - 0.01568627450980392
  - 0.03137254901960784
  step_size: epsilon / iterations
  iterations: 10
  momentum: 1.0
  gradient_estimator: integrated-gradients
  gradient_aggregation: consensus-orthogonal-weighting
  method_hyperparameters: published-protocol
evaluation:
  first_scope: full
  source_label: 1
  target_class: 0
  secondary_condition: untargeted-both-classes
  manifest: manifests/celebA/test_fake.jsonl
  sample_limit: null
  source_target_protocol: leave-one-detector-out
  target_models:
  - vit_b_16
  - densenet121_dct
  seed: 0
required_tests:
- output shape and uint8 type
- finite per-model integrated gradients
- deterministic output for fixed seed
- targeted loss direction
- Linf projection after every update
- consensus and orthogonal components reconstruct each input gradient
- orthogonal components have zero projection on the consensus subspace
- equal-weight control recovery
- held-out target never influences generation or selection
retention_gate:
  metric: held_out_conditional_transfer_asr
  minimum_gain_percentage_points: 0
  maximum_ssim_regression: 0.01
  maximum_lpips_regression: 0.01
gpu:
  requested_memory_mb: 24000
  timeout_seconds: 28800
protected_files:
- AADD-2026/AADD_2026_evaluation.py
- manifests
- weights
- results
