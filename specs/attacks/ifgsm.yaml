schema_version: 1
idea_id: ifgsm
status: approved
title: Iterative FGSM pipeline regression
hypothesis: 'Реализованная и проверенная на GPU атака подтверждает, что чекаут, окружение,
  очередь и верификатор целы, до того как агент напишет новый код.

  '
novelty: 'Контрольная регрессия, а не исследовательский результат.

  '
baseline:
  attack: clean
implementation:
  module: attacks.ifgsm
  source_model: each-valid-single-source
  targeted: true
  fidelity: 'frozen: preserve the existing behaviour byte for byte'
parameters:
  epsilon:
  - 0.00784313725490196
  - 0.01568627450980392
  - 0.03137254901960784
  iterations: 10
  step_size: epsilon / 4
evaluation:
  first_scope: smoke
  source_label: 1
  target_class: 0
  manifest: manifests/celebA/test_fake.jsonl
  sample_limit: null
  target_models:
  - vit_b_16
  - densenet121_dct
  seed: 0
required_tests:
- output shape and uint8 type
- deterministic output for fixed seed
- Linf bound after uint8 save and reload
- behaviour is unchanged from the frozen implementation
retention_gate:
  metric: white_box_conditional_asr
  minimum_gain_percentage_points: 0
  maximum_ssim_regression: 0.01
  maximum_lpips_regression: 0.01
gpu:
  requested_memory_mb: 24000
  timeout_seconds: 7200
protected_files:
- AADD-2026/AADD_2026_evaluation.py
- manifests
- weights
- results
