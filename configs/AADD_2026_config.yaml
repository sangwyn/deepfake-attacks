# Legacy evaluator example for the audited server layout.
# Scientific campaign runs use configs/experiments and attacklab instead.
original_root: /home/aiattacks/dataset/celebA/TEST/TEST_FAKE

attack: ifgsm

save_attacked_dir: /home/aiattacks/oleg/aadd-attack-runs/legacy-ifgsm/images

models_dir: /home/aiattacks/oleg/aadd-attack-assets/weights

save_json: experiments/results_ifgsm.json


# Choose classifiers for evaluation. IFGSM currently requires vit_b_16;
# use attack: identity to smoke-test with only the available DCT checkpoint.
classifiers:                              
  - vit_b_16
  # - densenet121_dct


# Leave the settings below unchanged (the evaluation will be based on these, such reported on challenge Website: https://iplab.dmi.unict.it/mfs/acm-aadd-challenge-2026/):
dct_log_scale: true

weights:
  vit_b_16:    1.0
  densenet121_dct: 1.0

aggregate: sum  

device: auto  

alpha: 0.5 # weight for alpha*SSIM vs (1-alpha)*(1-LPIPS)
