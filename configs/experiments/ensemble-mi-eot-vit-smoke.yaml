schema_version: 1
experiment_id: ensemble-mi-eot-vit-smoke-seed0
scope: smoke
seed: 0
server_config: configs/pipeline/server.yaml

dataset:
  manifest: manifests/celebA/test_fake.jsonl
  source_label: 1
  selection: manifest-order
  sample_limit: 8
  require_clean_correct: true

attack:
  name: ensemble-mi-eot
  module: attacks.ensemble_mi_fgsm_eot
  source_model: vit_b_16
  target_class: 0
  parameters:
    epsilon: 0.03137254901960784
    step_size: 0.0031372549019607844
    iterations: 10
    momentum: 1.0
    ensemble_weighting: uniform
    eot_samples: 5
    transformations: [resize, crop, jpeg-like]

models:
  - vit_b_16
  - densenet121_dct

constraint:
  norm: linf
  epsilon: 0.03137254901960784
  pixel_range: [0.0, 1.0]
  output_format: png

metrics:
  targeted_asr: true
  ssim: true
  lpips: true
  report_clean_accuracy: true
  report_transfer_matrix: true
