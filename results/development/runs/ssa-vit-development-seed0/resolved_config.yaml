schema_version: 1
experiment_id: ssa-vit-development-seed0
scope: development
seed: 0
server_config: configs/pipeline/server.yaml

dataset:
  manifest: manifests/celebA/test_fake.jsonl
  source_label: 1
  selection: all
  sample_limit: null
  require_clean_correct: true

attack:
  name: ssa
  module: attacks.ssa_s2i_fgsm
  source_model: vit_b_16
  target_class: 0
  parameters:
    epsilon: 0.03137254901960784
    step_size: 0.0031372549019607844
    iterations: 10
    momentum: 1.0
    frequency_samples: 20
    spectrum_noise_sigma: 0.06274509803921569
    spectrum_amplitude_rho: 0.5
    transform: orthonormal-dct
    spectrum_mask: random

models:
  - vit_b_16
  - densenet121_dct

constraint:
  norm: linf
  epsilon: 0.03137254901960784
  pixel_range: [0.0, 1.0]
  output_format: png

metrics:
  targeted_asr: true
  ssim: true
  lpips: true
  report_clean_accuracy: true
  report_transfer_matrix: true
