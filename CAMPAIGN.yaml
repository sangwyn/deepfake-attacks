schema_version: 1

preflight:
  directories:
    - /home/aiattacks/dataset/celebA/TRAIN/TRAIN_REAL
    - /home/aiattacks/dataset/celebA/TRAIN/TRAIN_FAKE
    - /home/aiattacks/dataset/celebA/TEST/TEST_REAL
    - /home/aiattacks/dataset/celebA/TEST/TEST_FAKE
    - /home/aiattacks/oleg/aadd-attack-assets/weights
  files:
    - configs/pipeline/server.yaml
    - environment.lock.json
    - requirements.lock
    - /home/aiattacks/oleg/aadd-attack-assets/weights/vit_b_16.pth
    - /home/aiattacks/oleg/aadd-attack-assets/weights/densenet121_dct.pth

control:
  opencode_binary: /home/aiattacks/.opencode/bin/opencode
  opencode_version: 1.18.26
  model: naapi/gpt-5.6-luna
  pure: true
  # Declared target. The controller is sequential today and starts one worker
  # at a time; raising this has no effect until per-worker Git worktrees exist.
  max_parallel_agents: 1
  gpu_queue_state: .gpuq

profiles:
  development:
    description: >-
      Reviewed baseline suite in ascending cost order, alternating smoke and
      development per attack. Cost is dominated by gradient evaluations per
      image: FGSM 1, PGD and MI-DI-FGSM about 10, ensemble EoT about 100,
      SSA about 200, MIG-COW several hundred.
    tasks:
      # Pipeline regression, not a research result. The only already-implemented
      # attack; it proves the checkout, environment, queue, and verifier are
      # sound before any agent writes new code.
      - id: ifgsm-smoke
        attack: ifgsm
        scope: smoke
        required: true

      # 1 gradient evaluation per image.
      - id: fgsm-smoke
        attack: fgsm
        scope: smoke
        required: true
        needs: [ifgsm-smoke]

      - id: fgsm-development
        attack: fgsm
        scope: development
        required: true
        needs: [fgsm-smoke]

      # 10 gradient evaluations per image.
      - id: pgd-smoke
        attack: pgd
        scope: smoke
        required: true
        needs: [fgsm-development]

      - id: pgd-development
        attack: pgd
        scope: development
        required: true
        needs: [pgd-smoke]

      # 10 evaluations plus the input-diversity transform.
      - id: mi-di-fgsm-smoke
        attack: mi-di-fgsm
        scope: smoke
        required: true
        needs: [pgd-development]

      - id: mi-di-fgsm-development
        attack: mi-di-fgsm
        scope: development
        required: true
        needs: [mi-di-fgsm-smoke]

      # About 100 evaluations: 10 steps over 2 sources and 5 EoT samples.
      # Optional: with two detectors the ensemble cannot be held out, so this
      # produces robustness evidence rather than a transfer result.
      - id: ensemble-mi-eot-smoke
        attack: ensemble-mi-eot
        scope: smoke
        required: false
        needs: [mi-di-fgsm-development]

      - id: ensemble-mi-eot-development
        attack: ensemble-mi-eot
        scope: development
        required: false
        needs: [ensemble-mi-eot-smoke]

      # About 200 evaluations: 10 steps over 20 spectrum samples.
      - id: ssa-smoke
        attack: ssa
        scope: smoke
        required: true
        needs: [mi-di-fgsm-development]
        after: [ensemble-mi-eot-development]

      - id: ssa-development
        attack: ssa
        scope: development
        required: true
        needs: [ssa-smoke]

      # Several hundred evaluations. Optional: leave-one-detector-out leaves a
      # single source here, so the worker is expected to block rather than
      # report a degenerate ensemble as transfer evidence.
      - id: mig-cow-smoke
        attack: mig-cow
        scope: smoke
        required: false
        needs: [ssa-development]

      - id: mig-cow-development
        attack: mig-cow
        scope: development
        required: false
        needs: [mig-cow-smoke]

      - id: select-finalists
        kind: review
        required: true
        needs: [ssa-development]
        after: [ensemble-mi-eot-development, mig-cow-development]

  full:
    description: Replication, budget sensitivity, full-data, and official runs for frozen finalists.
    source_profile: development
    selector_task: select-finalists
    scope: full
    max_finalists: 2
