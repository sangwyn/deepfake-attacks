schema_version: 1

preflight:
  directories:
    - /home/aiattacks/dataset/celebA/TRAIN/TRAIN_REAL
    - /home/aiattacks/dataset/celebA/TRAIN/TRAIN_FAKE
    - /home/aiattacks/dataset/celebA/TEST/TEST_REAL
    - /home/aiattacks/dataset/celebA/TEST/TEST_FAKE
    - /home/aiattacks/oleg/aadd-attack-assets/weights
  files:
    - configs/pipeline/server.yaml
    - environment.lock.json
    - requirements.lock
    - /home/aiattacks/oleg/aadd-attack-assets/weights/vit_b_16.pth
    - /home/aiattacks/oleg/aadd-attack-assets/weights/densenet121_dct.pth

control:
  opencode_binary: /home/aiattacks/.opencode/bin/opencode
  opencode_version: 1.18.26
  model: naapi/gpt-5.6-luna
  pure: true
  # Declared target. The controller is sequential today and starts one worker
  # at a time; raising this has no effect until per-worker Git worktrees exist.
  max_parallel_agents: 1
  gpu_queue_state: .gpuq

profiles:
  development:
    description: Smoke and seed-0 development evaluation for every attack, followed by finalist selection.
    tasks:
      - id: ifgsm-smoke
        attack: ifgsm
        scope: smoke
        required: true

      - id: ifgsm-development
        attack: ifgsm
        scope: development
        required: true
        needs: [ifgsm-smoke]

      - id: fgsm-smoke
        attack: fgsm
        scope: smoke
        required: true
        needs: [ifgsm-smoke]

      - id: fgsm-development
        attack: fgsm
        scope: development
        required: true
        needs: [fgsm-smoke]

      - id: pgd-smoke
        attack: pgd
        scope: smoke
        required: true
        needs: [ifgsm-development]

      - id: pgd-development
        attack: pgd
        scope: development
        required: true
        needs: [pgd-smoke]

      - id: mifgsm-smoke
        attack: mifgsm
        scope: smoke
        required: true
        needs: [ifgsm-development]

      - id: mifgsm-development
        attack: mifgsm
        scope: development
        required: true
        needs: [mifgsm-smoke]

      - id: di-mi-fgsm-smoke
        attack: di-mi-fgsm
        scope: smoke
        required: true
        needs: [mifgsm-development]

      - id: di-mi-fgsm-development
        attack: di-mi-fgsm
        scope: development
        required: true
        needs: [di-mi-fgsm-smoke]

      - id: ti-di-mi-fgsm-smoke
        attack: ti-di-mi-fgsm
        scope: smoke
        required: true
        needs: [di-mi-fgsm-development]

      - id: ti-di-mi-fgsm-development
        attack: ti-di-mi-fgsm
        scope: development
        required: true
        needs: [ti-di-mi-fgsm-smoke]

      - id: frequency-eot-smoke
        attack: frequency-eot
        scope: smoke
        required: true
        needs: [ti-di-mi-fgsm-development]

      - id: frequency-eot-development
        attack: frequency-eot
        scope: development
        required: true
        needs: [frequency-eot-smoke]

      - id: mig-cow-smoke
        attack: mig-cow
        scope: smoke
        required: false
        needs: [frequency-eot-development]

      - id: mig-cow-development
        attack: mig-cow
        scope: development
        required: false
        needs: [mig-cow-smoke]

      - id: prototype-smoke
        attack: prototype
        scope: smoke
        required: false
        after: [mig-cow-development]

      - id: prototype-development
        attack: prototype
        scope: development
        required: false
        needs: [prototype-smoke]

      - id: dd-fcma-smoke
        attack: dd-fcma
        scope: smoke
        required: true
        needs: [frequency-eot-development]
        after: [mig-cow-development, prototype-development]

      - id: dd-fcma-development
        attack: dd-fcma
        scope: development
        required: true
        needs: [dd-fcma-smoke]

      - id: select-finalists
        kind: review
        required: true
        needs: [dd-fcma-development]
        after: [mig-cow-development, prototype-development]

  full:
    description: Replication, budget sensitivity, full-data, and official runs for frozen finalists.
    source_profile: development
    selector_task: select-finalists
    scope: full
    max_finalists: 2
