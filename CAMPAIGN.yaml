schema_version: 1

preflight:
  directories:
    - /home/aiattacks/dataset/celebA/TRAIN/TRAIN_REAL
    - /home/aiattacks/dataset/celebA/TRAIN/TRAIN_FAKE
    - /home/aiattacks/dataset/celebA/TEST/TEST_REAL
    - /home/aiattacks/dataset/celebA/TEST/TEST_FAKE
    - /home/aiattacks/oleg/aadd-attack-assets/weights
  files:
    - configs/pipeline/server.yaml
    - environment.lock.json
    - requirements.lock
    - /home/aiattacks/oleg/aadd-attack-assets/weights/vit_b_16.pth
    - /home/aiattacks/oleg/aadd-attack-assets/weights/densenet121_dct.pth

control:
  opencode_binary: /home/aiattacks/.opencode/bin/opencode
  opencode_version: 1.18.26
  model: naapi/gpt-5.6-terra
  pure: true
  # Declared target. The controller is sequential today and starts one worker
  # at a time; raising this has no effect until per-worker Git worktrees exist.
  max_parallel_agents: 1
  gpu_queue_state: .gpuq

profiles:
  development:
    description: >-
      Обе стороны матрицы переноса для каждой атаки, задачи в порядке
      возрастания стоимости. Суффикс задачи — детектор, от которого берётся
      градиент; цели всегда оба детектора.
    tasks:
      # Регрессия пайплайна: единственная проверенная атака.
      - id: ifgsm-vit-smoke
        attack: ifgsm
        scope: smoke
        source: vit_b_16
        required: true

      - id: ifgsm-dct-smoke
        attack: ifgsm
        scope: smoke
        source: densenet121_dct
        required: true
        needs: [ifgsm-vit-smoke]

      # 1 вычисление градиента на изображение.
      - id: fgsm-vit-smoke
        attack: fgsm
        scope: smoke
        source: vit_b_16
        required: true
        needs: [ifgsm-dct-smoke]

      - id: fgsm-vit-development
        attack: fgsm
        scope: development
        source: vit_b_16
        required: true
        needs: [fgsm-vit-smoke]

      - id: fgsm-dct-smoke
        attack: fgsm
        scope: smoke
        source: densenet121_dct
        required: true
        needs: [fgsm-vit-development]

      - id: fgsm-dct-development
        attack: fgsm
        scope: development
        source: densenet121_dct
        required: true
        needs: [fgsm-dct-smoke]

      # 10 вычислений.
      - id: pgd-vit-smoke
        attack: pgd
        scope: smoke
        source: vit_b_16
        required: true
        needs: [fgsm-dct-development]

      - id: pgd-vit-development
        attack: pgd
        scope: development
        source: vit_b_16
        required: true
        needs: [pgd-vit-smoke]

      - id: pgd-dct-smoke
        attack: pgd
        scope: smoke
        source: densenet121_dct
        required: true
        needs: [pgd-vit-development]

      - id: pgd-dct-development
        attack: pgd
        scope: development
        source: densenet121_dct
        required: true
        needs: [pgd-dct-smoke]

      # 10 вычислений плюс преобразование входа.
      - id: mi-di-fgsm-vit-smoke
        attack: mi-di-fgsm
        scope: smoke
        source: vit_b_16
        required: true
        needs: [pgd-dct-development]

      - id: mi-di-fgsm-vit-development
        attack: mi-di-fgsm
        scope: development
        source: vit_b_16
        required: true
        needs: [mi-di-fgsm-vit-smoke]

      - id: mi-di-fgsm-dct-smoke
        attack: mi-di-fgsm
        scope: smoke
        source: densenet121_dct
        required: true
        needs: [mi-di-fgsm-vit-development]

      - id: mi-di-fgsm-dct-development
        attack: mi-di-fgsm
        scope: development
        source: densenet121_dct
        required: true
        needs: [mi-di-fgsm-dct-smoke]

      # ~100: 10 шагов на 2 источника и 5 EoT-выборок.
      # ~200: 10 шагов на 20 выборок спектра.
      - id: ssa-vit-smoke
        attack: ssa
        scope: smoke
        source: vit_b_16
        required: true
        needs: [mi-di-fgsm-dct-development]

      - id: ssa-vit-development
        attack: ssa
        scope: development
        source: vit_b_16
        required: true
        needs: [ssa-vit-smoke]

      - id: ssa-dct-smoke
        attack: ssa
        scope: smoke
        source: densenet121_dct
        required: true
        needs: [ssa-vit-development]

      - id: ssa-dct-development
        attack: ssa
        scope: development
        source: densenet121_dct
        required: true
        needs: [ssa-dct-smoke]

      # Несколько сотен вычислений.
      - id: select-finalists
        kind: review
        required: true
        needs: [ssa-dct-development]
  full:
    description: Replication, budget sensitivity, full-data, and official runs for frozen finalists.
    source_profile: development
    selector_task: select-finalists
    scope: full
    max_finalists: 2
